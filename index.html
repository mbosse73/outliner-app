/* --- Datepicker: eigenes Fenster statt <input type="date">, das ist nicht
       gestaltbar und wirkt wie ein Fremdkörper. Ersetzt gezielt den
       angeklickten Treffertext, genau wie eine Handeingabe es täte —
       task.due/task.start bleiben ISO, nur der Text wird deutsch. --- */
let waehlerOffen = false;
let waehlerKontext = null;   // { id, feld, treffer, monat }
const dwEl = $("#datumwaehler");

function datumWaehlerOeffnen(id, feld, treffer){
  const iso = loeseDatum(treffer.slice(1)) || heuteISO();
  waehlerKontext = { id, feld, treffer, monat: tagAus(iso) };
  waehlerOffen = true;
  dwEl.hidden = false;
  datumWaehlerZeichnen();
}
function datumWaehlerSchliessen(){
  waehlerOffen = false;
  dwEl.hidden = true;
  waehlerKontext = null;
}
function datumWaehlerBlaettern(r){
  waehlerKontext.monat.setMonth(waehlerKontext.monat.getMonth() + r);
  datumWaehlerZeichnen();
}
function datumWaehlerZeichnen(){
  const { monat, treffer } = waehlerKontext;
  const monatISO = alsISO(monat).slice(0, 7);
  $("#dw-titel").textContent = MONAT_FMT.format(monat);

  const koepfe = $("#dw-tage");
  if (!koepfe.childElementCount){
    for (let i = 0; i < 7; i++){
      const s = document.createElement("b");
      s.textContent = WOCHENTAG_FMT.format(tagAus(plusTage(aufMontag(monatISO + "-01"), i)));
      koepfe.appendChild(s);
    }
  }

  const gewaehlt = loeseDatum(treffer.slice(1));
  const heute = heuteISO();
  const raster = $("#dw-raster");
  raster.textContent = "";
  let w = aufMontag(monatISO + "-01");
  const letzter = plusTage(tagAus(monatISO + "-01").getMonth() === 11
    ? (Number(monatISO.slice(0, 4)) + 1) + "-01-01" : monatISO.slice(0, 5) +
      String(tagAus(monatISO + "-01").getMonth() + 2).padStart(2, "0") + "-01", -1);
  while (w <= letzter){
    for (let i = 0; i < 7; i++){
      const tagISO = plusTage(w, i);
      const b = document.createElement("button");
      b.className = "dwtag"
        + (tagISO.slice(0, 7) !== monatISO ? " fremd" : "")
        + (tagISO === heute ? " heute" : "")
        + (tagISO === gewaehlt ? " gewaehlt" : "");
      b.textContent = String(tagAus(tagISO).getDate());
      b.addEventListener("click", () => datumWaehlerUebernehmen(tagISO));
      raster.appendChild(b);
    }
    w = plusTage(w, 7);
  }
}
function datumWaehlerUebernehmen(iso){
  const { id, feld, treffer } = waehlerKontext;
  datumWaehlerSchliessen();
  const n = nodes[id];
  if (!n) return;
  const alt = feld === "note" ? n.note : n.text;
  if (!alt || alt.indexOf(treffer) === -1) return;   // Zeile hat sich inzwischen geändert
  begin("Datum wählen");
  touch(id);
  const neu = alt.replace(treffer, "@" + alsDE(iso));
  if (feld === "note") n.note = neu; else n.text = neu;
  n.modified = Date.now();
  merkmaleSpiegeln(n);
  commit();
  lastTextTx = null;
  render(false);   // die Zeile selbst ist die Rückmeldung, kein toast
}
$("#dw-zurueck").addEventListener("click", () => datumWaehlerBlaettern(-1));
$("#dw-vor").addEventListener("click", () => datumWaehlerBlaettern(1));
dwEl.addEventListener("mousedown", e => { if (e.target === dwEl) datumWaehlerSchliessen(); });

/* Der Palettenbefehl schreibt das Zeichen in den Text, statt task.prio
   daran vorbei zu setzen. So bleibt der Text die einzige Wahrheit und
   beide Wege — tippen oder Palette — führen zum selben Ergebnis. */
function prioSetzen(id, stufe){
  const n = nodes[id];
  if (!n) return;
  begin(stufe ? "Priorität " + stufe : "Priorität entfernen");
  touch(id);
  let t = n.text.replace(PRIO_RE, "").replace(/\s{2,}/g, " ").trim();
  if (stufe) t = t ? t + " !" + stufe : "!" + stufe;
  n.text = t;
  merkmaleSpiegeln(n);
  n.modified = Date.now();
  commit();
  lastTextTx = null;
  focusState = { id, field: "text", pos: Infinity };
  render(true);
  toast(stufe ? "Priorität " + stufe : "Priorität entfernt");
}

function pfadVon(id){
  const p = [];
  let cur = nodes[id] ? nodes[id].parentId : null;
  while (cur){
    p.unshift(cur === ROOT ? (nodes[ROOT].text.trim() || "Outliner") : (nodes[cur].text.trim() || "Ohne Titel"));
    cur = nodes[cur].parentId;
  }
  return p.join(" › ");
}

// Zu einem Punkt springen: Vorfahren aufklappen, Suche zurücksetzen, Cursor setzen
function springeZu(id){
  if (!nodes[id]) return;
  begin("Aufklappen");
  let cur = nodes[id].parentId;
  while (cur){
    if (nodes[cur].collapsed){ touch(cur); nodes[cur].collapsed = false; }
    cur = nodes[cur].parentId;
  }
  commit();
  query = "";
  zoomId = ROOT;
  focusState = { id, field: "text", pos: Infinity };
  render(true);
}

const palEl = $("#palette");
const palEingabe = $("#pal-eingabe");
const palListe = $("#pal-liste");
let palOffen = false, palPosten = [], palWahl = 0;

function palOeffnen(vorbelegt){
  palOffen = true;
  palEl.hidden = false;
  palEingabe.value = vorbelegt || "";
  palBauen();
  palEingabe.focus();
  palEingabe.select();
}
function palSchliessen(){
  palOffen = false;
  palEl.hidden = true;
  applyFocus();
}

function palBauen(){
  const q = palEingabe.value.trim().toLowerCase();
  palPosten = [];
  const gruppen = [];

  const befehle = BEFEHLE.filter(b => !q || (b.a + " " + b.t).toLowerCase().includes(q));

  if (!q){
    const favs = Object.keys(nodes).filter(id => id !== ROOT && nodes[id].fav);
    if (favs.length) gruppen.push(["Angeheftet", favs.map(id => postenAusNode(id))]);
    const jung = Object.keys(nodes)
      .filter(id => id !== ROOT && nodes[id].text.trim())
      .sort((a, b) => (nodes[b].modified || 0) - (nodes[a].modified || 0))
      .slice(0, 6);
    if (jung.length) gruppen.push(["Zuletzt bearbeitet", jung.map(id => postenAusNode(id))]);
    const tags = alleTags().slice(0, 6);
    if (tags.length) gruppen.push(["Tags", tags.map(([t, n]) => ({
      a: "Tag", t: "#" + t, m: n + (n === 1 ? " Punkt" : " Punkte"),
      run: () => { palSchliessen(); setzeSuche("#" + t); sucheEl.focus(); }
    }))]);
  } else {
    const treffer = Object.keys(nodes)
      .filter(id => id !== ROOT && (nodes[id].text + " " + (nodes[id].note || "")).toLowerCase().includes(q))
      .sort((a, b) => (nodes[b].modified || 0) - (nodes[a].modified || 0))
      .slice(0, 12);
    if (treffer.length) gruppen.push(["Punkte", treffer.map(id => postenAusNode(id))]);
    if (treffer.length) gruppen.push(["Suche", [{
      a: "Filter", t: "„" + palEingabe.value.trim() + "“ in der Gliederung zeigen",
      m: "Struktur bleibt stehen, alles ohne Treffer verschwindet",
      run: () => { palSchliessen(); setzeSuche(palEingabe.value.trim()); }
    }]]);
  }
  if (befehle.length) gruppen.push(["Befehle", befehle.map(b => ({
    a: b.a, t: b.t, m: b.m, run: () => { palSchliessen(); b.run(); }
  }))]);

  palListe.textContent = "";
  if (!gruppen.length){
    const leer = document.createElement("div");
    leer.className = "pleer";
    leer.textContent = "Nichts gefunden. Andere Schreibweise versuchen oder mit # nach einem Tag suchen.";
    palListe.appendChild(leer);
    return;
  }
  for (const [titel, posten] of gruppen){
    const h = document.createElement("div");
    h.className = "pgrp";
    h.textContent = titel;
    palListe.appendChild(h);
    for (const p of posten){
      const i = palPosten.length;
      palPosten.push(p);
      const b = document.createElement("button");
      b.className = "tr";
      b.dataset.i = i;
      const a = document.createElement("span"); a.className = "tr-a"; a.textContent = p.a;
      const mitte = document.createElement("span"); mitte.className = "tr-b";
      const t = document.createElement("span"); t.className = "tr-t"; t.textContent = p.t;
      mitte.appendChild(t);
      if (p.m){ const m = document.createElement("span"); m.className = "tr-m"; m.textContent = p.m; mitte.appendChild(m); }
      b.append(a, mitte);
      b.addEventListener("mousedown", e => { e.preventDefault(); palPosten[i].run(); });
      palListe.appendChild(b);
    }
  }
  palWahl = 0;
  palMarkieren();
}
function postenAusNode(id){
  const n = nodes[id];
  return {
    a: n.fav ? "Angeheftet" : "Punkt",
    t: n.text.trim() || "Ohne Text",
    m: pfadVon(id),
    run: () => { palSchliessen(); springeZu(id); }
  };
}
function palMarkieren(){
  const knoepfe = palListe.querySelectorAll(".tr");
  knoepfe.forEach(b => b.classList.toggle("wahl", Number(b.dataset.i) === palWahl));
  const aktiv = palListe.querySelector(".tr.wahl");
  if (aktiv && aktiv.scrollIntoView) aktiv.scrollIntoView({ block: "nearest" });
}

palEingabe.addEventListener("input", palBauen);
/* stopPropagation ist wesentlich: palSchliessen() setzt palOffen auf false,
   danach greift der Waechter im document-Lauscher nicht mehr und derselbe
   Tastendruck wuerde ein zweites Mal auf die Gliederung wirken. */
palEingabe.addEventListener("keydown", e => {
  if (e.key === "Escape"){ e.preventDefault(); e.stopPropagation(); palSchliessen(); return; }
  if (e.key === "ArrowDown"){ e.preventDefault(); palWahl = Math.min(palWahl + 1, palPosten.length - 1); palMarkieren(); return; }
  if (e.key === "ArrowUp"){ e.preventDefault(); palWahl = Math.max(palWahl - 1, 0); palMarkieren(); return; }
  if (e.key === "Enter"){
    e.preventDefault();
    e.stopPropagation();
    const p = palPosten[palWahl];
    if (p) p.run();
    return;
  }
});
palEl.addEventListener("mousedown", e => { if (e.target === palEl) palSchliessen(); });

/* =========================================================================
   13 — Ansichten
   Gantt und Mindmap sind Projektionen derselben Nodes. Beide lesen
   rowIndex — damit gelten Fokus, Zuklappen und Suche dort unveraendert,
   ohne dass eine Ansicht eigene Sichtbarkeitsregeln bekaeme.
   ========================================================================= */

const ganttEl = $("#gantt");
const kalenderEl = $("#kalender");
const mindmapEl = $("#mindmap");
const docEl = document.querySelector(".doc");

function ansichtZeigen(){
  rowsEl.hidden = ansicht !== "gliederung";
  ganttEl.hidden = ansicht !== "gantt";
  kalenderEl.hidden = ansicht !== "kalender";
  mindmapEl.hidden = ansicht !== "mindmap";
  docEl.classList.toggle("weit", ansicht !== "gliederung");
  document.querySelectorAll(".sicht").forEach(b =>
    b.classList.toggle("an", b.dataset.sicht === ansicht));
}
function setzeAnsicht(a){
  if (ansicht === a) return;
  ansicht = a;
  scheduleSave();
  render(a === "gliederung");
  $("#sheet").scrollTop = 0;
}
function zeichneAnsicht(){
  if (ansicht === "gantt") zeichneGantt();
  else if (ansicht === "kalender") zeichneKalender();
  else if (ansicht === "mindmap") zeichneMindmap();
}
document.querySelectorAll(".sicht").forEach(b =>
  b.addEventListener("click", () => setzeAnsicht(b.dataset.sicht)));

/* --- Tage rechnen. Gespeichert wird JJJJ-MM-TT, das laesst sich direkt
       vergleichen; nur fuer Abstaende braucht es kurz ein Date. --- */
function tagAus(iso){
  const [j, m, t] = iso.split("-").map(Number);
  return new Date(j, m - 1, t);
}
function tageZwischen(a, b){ return Math.round((tagAus(b) - tagAus(a)) / 86400000); }
function plusTage(iso, n){ const d = tagAus(iso); d.setDate(d.getDate() + n); return alsISO(d); }
function aufMontag(iso){ return plusTage(iso, -((tagAus(iso).getDay() + 6) % 7)); }

/* Ein eigener Termin schlaegt die Zusammenfassung. Gerechnet wird ueber den
   ganzen Teilbaum, auch ueber zugeklappte Kinder: collapsed bestimmt, welche
   Zeilen erscheinen, nicht welche Termine zaehlen. */
function spannenRechner(){
  const merk = new Map();
  const rechne = id => {
    if (merk.has(id)) return merk.get(id);
    const n = nodes[id];
    let s = null;
    if (n && n.task && (n.task.due || n.task.start)){
      const a = n.task.start || n.task.due;
      const b = n.task.due || n.task.start;
      s = { von: a <= b ? a : b, bis: a <= b ? b : a, eigen: true };
    } else if (n){
      let von = null, bis = null;
      for (const cid of n.children){
        const k = rechne(cid);
        if (!k) continue;
        if (!von || k.von < von) von = k.von;
        if (!bis || k.bis > bis) bis = k.bis;
      }
      if (von) s = { von, bis, eigen: false };
    }
    merk.set(id, s);
    return s;
  };
  return rechne;
}

const MONAT_FMT = new Intl.DateTimeFormat("de-DE", { month: "long", year: "numeric" });

function zeichneGantt(){
  ganttEl.textContent = "";
  const spanne = spannenRechner();
  // Nur Zeilen mit Termin. Weil sich die Spanne nach oben fortsetzt, bleiben
  // die uebergeordneten Punkte als Weg stehen — dieselbe Idee wie keep in
  // der Suche. Undatierte Zweige bleiben ganz weg, statt leer mitzulaufen.
  const zeilen = rowIndex.map(m => ({ meta: m, s: spanne(m.id) })).filter(z => z.s);
  const mit = zeilen;

  if (!mit.length){
    const leer = document.createElement("div");
    leer.className = "gleer";
    leer.textContent = "Noch nichts mit Datum. Ein Punkt kommt hierher, sobald er eines trägt: "
      + "@09.03.2026 setzt eine Frist, @02.03.2026..06.03.2026 einen Zeitraum. "
      + "Übergeordnete Punkte fassen zusammen, was darunter liegt.";
    ganttEl.appendChild(leer);
    return;
  }

  let von = mit[0].s.von, bis = mit[0].s.bis;
  for (const z of mit){
    if (z.s.von < von) von = z.s.von;
    if (z.s.bis > bis) bis = z.s.bis;
  }
  von = aufMontag(von);
  bis = plusTage(aufMontag(bis), 6);
  const tage = tageZwischen(von, bis) + 1;
  const bei = iso => (tageZwischen(von, iso) / tage) * 100;

  const spalte = k => { const d = document.createElement("div"); d.className = k; return d; };

  // Kopf: Monatsnamen ueber der Zeitachse
  const kopf = spalte("gkopf");
  kopf.appendChild(spalte("glinks"));
  const kopfRechts = spalte("grechts");
  let m = von;
  while (m <= bis){
    const erster = m.slice(0, 8) + "01";
    const naechster = plusTage(m.slice(0, 8) + "01", 32);
    const monatEnde = plusTage(naechster.slice(0, 8) + "01", -1);
    const ende = monatEnde < bis ? monatEnde : bis;
    const eti = document.createElement("span");
    eti.className = "gmonat";
    eti.style.left = Math.max(0, bei(m)) + "%";
    eti.style.width = ((tageZwischen(m, ende) + 1) / tage) * 100 + "%";
    eti.textContent = MONAT_FMT.format(tagAus(erster));
    kopfRechts.appendChild(eti);
    m = plusTage(ende, 1);
  }
  kopf.appendChild(kopfRechts);
  ganttEl.appendChild(kopf);

  const koerper = spalte("gkoerper");

  // Netz: Wochenlinien und Heute, in derselben Aufteilung wie die Zeilen
  const netz = spalte("gnetz");
  netz.appendChild(spalte("glinks"));
  const netzRechts = spalte("grechts");
  for (let t = 0; t < tage; t += 7){
    const l = document.createElement("i");
    l.className = "gwoche";
    l.style.left = (t / tage) * 100 + "%";
    netzRechts.appendChild(l);
  }
  const heute = heuteISO();
  if (heute >= von && heute <= bis){
    const l = document.createElement("i");
    l.className = "gheute";
    l.style.left = bei(heute) + "%";
    l.title = "Heute";
    netzRechts.appendChild(l);
  }
  netz.appendChild(netzRechts);
  koerper.appendChild(netz);

  for (const z of zeilen){
    const n = nodes[z.meta.id];
    const zeile = spalte("gzeile");
    zeile.style.setProperty("--depth", z.meta.depth);
    zeile.classList.toggle("erledigt", istErledigt(n));

    const name = spalte("gname");
    // Termin und Fortschritt stehen als Balken daneben — sie muessen im
    // Namen nicht noch einmal buchstabiert werden. Tags und Prioritaet
    // bleiben, die zeigt hier sonst nichts.
    const kurz = n.text.replace(FRIST_RE, "").replace(PROZENT_RE, "")
                       .replace(/\s{2,}/g, " ").trim();
    name.innerHTML = schmuecke(kurz || n.text.trim() || "Ohne Text", true);
    name.title = n.text.trim() || "Ohne Text";
    zeile.appendChild(name);

    const bahn = spalte("gbahn");
    if (z.s){
      const zustand = istUeberfaellig(n) ? "ueberfaellig" : istErledigt(n) ? "erledigt" : "";
      if (z.s.von === z.s.bis && z.s.eigen){
        // Zeitpunkt ohne Anfang: Meilenstein
        const r = document.createElement("i");
        r.className = "graute " + zustand;
        r.style.left = (bei(z.s.von) + (0.5 / tage) * 100) + "%";
        r.title = alsDE(z.s.von);
        bahn.appendChild(r);
      } else {
        const b = spalte("gbalken " + (z.s.eigen ? zustand : "summe"));
        b.style.left = bei(z.s.von) + "%";
        b.style.width = ((tageZwischen(z.s.von, z.s.bis) + 1) / tage) * 100 + "%";
        b.title = alsDE(z.s.von) + " bis " + alsDE(z.s.bis) + (z.s.eigen ? "" : " (zusammengefasst)");
        if (z.s.eigen && n.task && n.task.progress){
          const f = document.createElement("i");
          f.className = "gfuell";
          f.style.width = Math.min(100, n.task.progress) + "%";
          b.appendChild(f);
        }
        bahn.appendChild(b);
      }
    }
    zeile.appendChild(bahn);
    koerper.appendChild(zeile);
  }
  ganttEl.appendChild(koerper);
}

/* --- Kalender ---------------------------------------------------------
   Anders als im Gantt gibt es hier keine Zusammenfassung: ein Monatsfeld
   hat wenig Platz, und ein Elternbalken nennt keinen Termin, den man
   wahrnehmen koennte. Es erscheint nur, was selbst ein Datum traegt. */

const WOCHENTAG_FMT = new Intl.DateTimeFormat("de-DE", { weekday: "short" });
const TAG_FMT = new Intl.DateTimeFormat("de-DE", { weekday: "long", day: "numeric", month: "long", year: "numeric" });

function kalenderAnker(){ return kalenderTag || heuteISO(); }

/* Bewusst visibleRows(true) statt rowIndex: ein Termin soll nicht
   verschwinden, weil sein Zweig in der Gliederung zugeklappt ist. Fokus
   und Suche gelten hier trotzdem. */
function kalenderEintraege(){
  return visibleRows(true).map(r => {
    const n = nodes[r.id];
    if (!n.task || (!n.task.due && !n.task.start)) return null;
    const a = n.task.start || n.task.due;
    const b = n.task.due || n.task.start;
    return { id: r.id, n, von: a <= b ? a : b, bis: a <= b ? b : a };
  }).filter(Boolean);
}
function eintragKlasse(n){
  return istUeberfaellig(n) ? "ueberfaellig" : istErledigt(n) ? "erledigt" : "";
}
function kalenderText(n){
  return n.text.replace(FRIST_RE, "").replace(PROZENT_RE, "")
               .replace(/\s{2,}/g, " ").trim() || n.text.trim() || "Ohne Text";
}
function eintragKnopf(e, klasse){
  const b = document.createElement("button");
  b.className = klasse + " " + eintragKlasse(e.n);
  b.textContent = kalenderText(e.n);
  b.title = e.von === e.bis ? alsDE(e.von) : alsDE(e.von) + " bis " + alsDE(e.bis);
  b.addEventListener("click", () => { setzeAnsicht("gliederung"); springeZu(e.id); });
  return b;
}

/* Eine Wochenzeile. Monat ruft das je Woche, die Wochenansicht einmal mit
   mehr Spuren — es ist dieselbe Zeichnung, nur unterschiedlich hoch. */
function zeichneWochenzeile(vonISO, maxSpuren, alleEintraege, monat){
  const bisISO = plusTage(vonISO, 6);
  const heute = heuteISO();

  const zeile = document.createElement("div");
  zeile.className = "kwoche";

  const koepfe = document.createElement("div");
  koepfe.className = "ktage";
  for (let i = 0; i < 7; i++){
    const t = plusTage(vonISO, i);
    const z = document.createElement("div");
    z.className = "ktag" + (t === heute ? " heute" : "") +
                  (monat && t.slice(0, 7) !== monat ? " fremd" : "");
    z.textContent = String(tagAus(t).getDate());
    koepfe.appendChild(z);
  }
  zeile.appendChild(koepfe);

  // Spuren verteilen: sonst lägen mehrtägige Balken übereinander
  const dieser = alleEintraege
    .filter(e => e.von <= bisISO && e.bis >= vonISO)
    .map(e => ({ e,
      a: Math.max(0, tageZwischen(vonISO, e.von)),
      b: Math.min(6, tageZwischen(vonISO, e.bis)),
      offenLinks: e.von < vonISO, offenRechts: e.bis > bisISO }))
    .sort((x, y) => x.a - y.a || (y.b - y.a) - (x.b - x.a));

  const spuren = [];
  for (const s of dieser){
    let i = 0;
    while (spuren[i] && spuren[i].some(o => !(s.b < o.a || s.a > o.b))) i++;
    (spuren[i] = spuren[i] || []).push(s);
    s.spur = i;
  }

  const flaeche = document.createElement("div");
  flaeche.className = "kbalken";
  const rest = new Array(7).fill(0);
  for (const s of dieser){
    if (s.spur >= maxSpuren){
      for (let i = s.a; i <= s.b; i++) rest[i]++;
      continue;
    }
    const b = eintragKnopf(s.e, "kein");
    b.style.left = (s.a / 7) * 100 + "%";
    b.style.width = ((s.b - s.a + 1) / 7) * 100 + "%";
    b.style.top = s.spur * 21 + "px";
    if (s.offenLinks) b.classList.add("offen-l");
    if (s.offenRechts) b.classList.add("offen-r");
    flaeche.appendChild(b);
  }
  const genutzt = Math.min(maxSpuren, spuren.length);
  for (let i = 0; i < 7; i++){
    if (!rest[i]) continue;
    const w = document.createElement("span");
    w.className = "kmehr";
    w.style.left = (i / 7) * 100 + "%";
    w.style.top = genutzt * 21 + "px";
    w.textContent = "+" + rest[i];
    flaeche.appendChild(w);
  }
  flaeche.style.height = (genutzt + (rest.some(Boolean) ? 1 : 0)) * 21 + 4 + "px";
  zeile.appendChild(flaeche);
  return zeile;
}

function zeichneKalender(){
  kalenderEl.textContent = "";
  const anker = kalenderAnker();
  const eintraege = kalenderEintraege();

  // Kopfzeile: hier, nicht oben in der Leiste — dort ist kein Platz
  const kopf = document.createElement("div");
  kopf.className = "kkopf";
  const titel = document.createElement("b");
  titel.className = "kzeitraum";
  titel.textContent = kalenderModus === "monat" ? MONAT_FMT.format(tagAus(anker))
    : kalenderModus === "woche"
      ? "Woche ab " + tagAus(aufMontag(anker)).toLocaleDateString("de-DE", { day:"numeric", month:"long", year:"numeric" })
      : TAG_FMT.format(tagAus(anker));
  kopf.appendChild(titel);

  const nav = document.createElement("div");
  nav.className = "knav";
  const schritt = r => {
    if (kalenderModus === "monat"){
      const d = tagAus(anker); d.setDate(1); d.setMonth(d.getMonth() + r);
      kalenderTag = alsISO(d);
    } else kalenderTag = plusTage(anker, r * (kalenderModus === "woche" ? 7 : 1));
    render(false);
  };
  const knopf = (t, titel, fn) => {
    const b = document.createElement("button");
    b.className = "knopf"; b.textContent = t; b.title = titel;
    b.addEventListener("click", fn);
    return b;
  };
  nav.appendChild(knopf("‹", "Zurück", () => schritt(-1)));
  nav.appendChild(knopf("Heute", "Zum heutigen Tag", () => { kalenderTag = heuteISO(); render(false); }));
  nav.appendChild(knopf("›", "Weiter", () => schritt(1)));
  kopf.appendChild(nav);

  const modi = document.createElement("div");
  modi.className = "kmodi";
  for (const m of KALENDERMODI){
    const b = document.createElement("button");
    b.className = "kmodus" + (m === kalenderModus ? " an" : "");
    b.textContent = m[0].toUpperCase() + m.slice(1);
    b.addEventListener("click", () => {
      kalenderModus = m; scheduleSave(); render(false);
    });
    modi.appendChild(b);
  }
  kopf.appendChild(modi);
  kalenderEl.appendChild(kopf);

  if (kalenderModus === "tag"){ zeichneKalenderTag(anker, eintraege); return; }

  // Wochentagsnamen
  const namen = document.createElement("div");
  namen.className = "kwtage";
  const montag = aufMontag(anker);
  for (let i = 0; i < 7; i++){
    const s = document.createElement("b");
    s.textContent = WOCHENTAG_FMT.format(tagAus(plusTage(montag, i)));
    namen.appendChild(s);
  }
  kalenderEl.appendChild(namen);

  const raster = document.createElement("div");
  raster.className = "kraster";
  if (kalenderModus === "woche"){
    const z = zeichneWochenzeile(montag, 10, eintraege, null);
    z.classList.add("gross");     // die Woche ist die ganze Ansicht, nicht eine Zeile
    raster.appendChild(z);
  } else {
    const monat = anker.slice(0, 7);
    let w = aufMontag(monat + "-01");
    const letzter = plusTage(tagAus(monat + "-01").getMonth() === 11
      ? (Number(monat.slice(0, 4)) + 1) + "-01-01" : monat.slice(0, 5) +
        String(tagAus(monat + "-01").getMonth() + 2).padStart(2, "0") + "-01", -1);
    while (w <= letzter){
      raster.appendChild(zeichneWochenzeile(w, 4, eintraege, monat));
      w = plusTage(w, 7);
    }
  }
  kalenderEl.appendChild(raster);
}

function zeichneKalenderTag(anker, eintraege){
  const liste = document.createElement("div");
  liste.className = "ktagliste";
  const dran = eintraege.filter(e => e.von <= anker && e.bis >= anker)
    .sort((a, b) => a.von.localeCompare(b.von) || kalenderText(a.n).localeCompare(kalenderText(b.n)));
  if (!dran.length){
    const leer = document.createElement("div");
    leer.className = "gleer";
    leer.textContent = "An diesem Tag steht nichts an.";
    liste.appendChild(leer);
  }
  for (const e of dran){
    const z = document.createElement("div");
    z.className = "kzeile";
    const wann = document.createElement("span");
    wann.className = "kwann";
    wann.textContent = e.von === e.bis ? "fällig"
      : (e.bis === anker ? "endet" : e.von === anker ? "beginnt" : "läuft");
    z.appendChild(wann);
    z.appendChild(eintragKnopf(e, "ktext"));
    if (e.n.task.progress !== null && e.n.task.progress !== undefined){
      const p = document.createElement("span");
      p.className = "fortschritt";
      p.textContent = e.n.task.progress + "%";
      z.appendChild(p);
    }
    liste.appendChild(z);
  }
  kalenderEl.appendChild(liste);
}

/* Mindmap: das SVG zieht nur die Verbindungen, die Beschriftungen liegen als
   HTML darueber — nur so bekommen sie Schriftvariablen, Ellipse und Zeiger. */
// Radial (der urspruengliche Aufbau): Bogenlaenge je Ring nach Blattzahl,
// damit sich nichts ueberlappt. farbindex wird beim ersten Ast (Kind der
// Wurzel) vergeben und an dessen ganzen Teilbaum weitergereicht.
function legeRadialWurzel(wurzel, kinder, blaetter, tiefstes, punkte){
  const ZEILE = 42;
  const blattzahl = Math.max(1, blaetter(wurzel));
  const noetig = (blattzahl * ZEILE) / (2 * Math.PI);
  const schritt = Math.min(240, Math.max(150, noetig / tiefstes));
  const rand = 165;
  const seite = 2 * schritt * tiefstes + rand * 2;
  const breite = Math.max(mindmapEl.clientWidth || 900, seite);
  const hoehe = seite;
  const cx = breite / 2, cy = hoehe / 2;

  let naechsterFarbindex = 0;
  const lege = (id, tiefe, a0, a1, farbindex) => {
    const w = (a0 + a1) / 2;
    const r = tiefe * schritt;
    punkte.push({ id, tiefe, x: cx + Math.cos(w) * r, y: cy + Math.sin(w) * r,
                  rechts: Math.cos(w) >= 0, farbindex });
    const k = kinder(id);
    if (!k.length) return;
    const gesamt = blaetter(id) || 1;
    let a = a0;
    for (const c of k){
      const anteil = blaetter(c) / gesamt;
      const fi = tiefe === 0 ? naechsterFarbindex++ : farbindex;
      lege(c, tiefe + 1, a, a + (a1 - a0) * anteil, fi);
      a += (a1 - a0) * anteil;
    }
  };
  lege(wurzel, 0, -Math.PI / 2, -Math.PI / 2 + 2 * Math.PI, null);
  return { breite, hoehe };
}

// Baumdiagramm: von oben nach unten, Blattzahl bestimmt die Spaltenbreite
// statt einer Bogenlaenge — sonst dieselbe Aufteilung wie beim Radial.
function legeBaum(wurzel, kinder, blaetter, tiefstes, punkte){
  const SPALTE = 150, EBENE = 130, RAND = 90;
  const blattzahl = Math.max(1, blaetter(wurzel));
  const breite = Math.max(mindmapEl.clientWidth || 900, blattzahl * SPALTE + RAND * 2);
  const hoehe = tiefstes * EBENE + RAND * 2 + 30;

  let naechsterFarbindex = 0;
  const lege = (id, tiefe, x0, x1, farbindex) => {
    const x = RAND + (x0 + x1) / 2 * (breite - RAND * 2);
    const y = RAND + tiefe * EBENE;
    punkte.push({ id, tiefe, x, y, rechts: true, farbindex });
    const k = kinder(id);
    if (!k.length) return;
    const gesamt = blaetter(id) || 1;
    let a = x0;
    for (const c of k){
      const anteil = blaetter(c) / gesamt;
      const fi = tiefe === 0 ? naechsterFarbindex++ : farbindex;
      lege(c, tiefe + 1, a, a + (x1 - x0) * anteil, fi);
      a += (x1 - x0) * anteil;
    }
  };
  lege(wurzel, 0, 0, 1, null);
  return { breite, hoehe };
}

// Zeitachse: die Aeste der Wurzel wandern auf eine horizontale Linie, sortiert
// nach der fruehesten Frist im jeweiligen Teilbaum (derselbe Rechner wie im
// Gantt). Ohne jedes Datum bleibt ein Ast in einer festen Spalte am Rand,
// statt zu verschwinden — verschwinden ist der teuerste Fehler dieser App.
// Tiefer verschachtelte Punkte faechern von dort aus radial auf, abwechselnd
// nach oben und unten, mit derselben Bogenrechnung wie beim Radial-Typ.
function legeZeit(wurzel, kinder, blaetter, tiefstes, punkte){
  const spanne = spannenRechner();
  const aeste = kinder(wurzel);
  const SCHRITT = 74;
  const ACHSE_Y = Math.max(240, 70 + tiefstes * SCHRITT);
  const RAND_X = 150, OHNE_BREITE = 190, SPUR = 190;

  const mitDatum = [], ohneDatum = [];
  for (const id of aeste){
    const s = spanne(id);
    (s ? mitDatum : ohneDatum).push(s ? { id, von: s.von } : { id });
  }
  mitDatum.sort((a, b) => a.von < b.von ? -1 : a.von > b.von ? 1 : 0);

  const achseBreite = Math.max(420, mitDatum.length * SPUR);
  const breite = Math.max(mindmapEl.clientWidth || 900,
    RAND_X + achseBreite + (ohneDatum.length ? OHNE_BREITE : 0) + RAND_X);
  const hoehe = Math.max(420, ACHSE_Y + tiefstes * SCHRITT + 150);

  const thema = MINDMAP_THEMEN[mindmapFarbe];
  const sonderPfade = [
    { x1: RAND_X, y1: ACHSE_Y, x2: RAND_X + achseBreite, y2: ACHSE_Y, farbe: "var(--rule2)", dick: 1.5 }
  ];
  punkte.push({ id: wurzel, tiefe: 0, x: RAND_X * 0.5, y: ACHSE_Y, rechts: true, farbindex: null });

  const legeFaecher = (id, tiefeRel, a0, a1, cx, cy, farbindex) => {
    const k = kinder(id);
    if (!k.length) return;
    const gesamt = blaetter(id) || 1;
    let a = a0;
    for (const c of k){
      const anteil = blaetter(c) / gesamt;
      const w = a + (a1 - a0) * anteil / 2;
      const r = (tiefeRel + 1) * SCHRITT;
      const x = cx + Math.cos(w) * r, y = cy + Math.sin(w) * r;
      punkte.push({ id: c, tiefe: tiefeRel + 1, x, y, rechts: Math.cos(w) >= 0, farbindex });
      legeFaecher(c, tiefeRel + 1, a, a + (a1 - a0) * anteil, cx, cy, farbindex);
      a += (a1 - a0) * anteil;
    }
  };

  let farbindex = 0;
  const legeAst = (id, x, y, oben) => {
    const a0 = oben ? Math.PI * 1.15 : Math.PI * 0.15;
    const a1 = oben ? Math.PI * 1.85 : Math.PI * 0.85;
    punkte.push({ id, tiefe: 1, x, y, rechts: true, farbindex });
    const linie = thema.aeste[farbindex % thema.aeste.length].linie;
    sonderPfade.push({ x1: x, y1: y - 9, x2: x, y2: y + 9, farbe: linie, dick: 2.5 });
    legeFaecher(id, 0, a0, a1, x, y, farbindex);
    farbindex++;
  };

  mitDatum.forEach((z, i) => {
    legeAst(z.id, RAND_X + achseBreite * ((i + 0.5) / mitDatum.length), ACHSE_Y, i % 2 === 0);
  });
  ohneDatum.forEach((z, i) => {
    legeAst(z.id, RAND_X + achseBreite + OHNE_BREITE / 2,
            ACHSE_Y + (i - (ohneDatum.length - 1) / 2) * 64, i % 2 === 0);
  });

  return { breite, hoehe, sonderPfade };
}

function mmBogen(a, b){
  const mx = (a.x + b.x) / 2;
  return "M" + a.x + " " + a.y + " C" + mx + " " + a.y + " " + mx + " " + b.y + " " + b.x + " " + b.y;
}
function mmKnick(a, b){
  const my = (a.y + b.y) / 2;
  return "M" + a.x + " " + a.y + " V" + my + " H" + b.x + " V" + b.y;
}

// Gemeinsam fuer die lebende Ansicht und den Export, damit beide nie
// auseinanderlaufen: Radial haengt die Beschriftung seitlich an, Baumdiagramm
// und Zeitachse zentrieren sie ueber dem Punkt; nur der Baum bekommt eckige
// Kaesten.
function mmKlassen(p, n, istWurzel){
  const liste = ["mast"];
  if (istWurzel) liste.push("mitte");
  else if (mindmapTyp === "radial") liste.push(p.rechts ? "rechts" : "links");
  else liste.push("flach");
  if (mindmapTyp === "baum" && !istWurzel) liste.push("eckig");
  if (istErledigt(n)) liste.push("erledigt");
  if (istUeberfaellig(n)) liste.push("ueberfaellig");
  return liste.join(" ");
}

// Gemeinsame Grundlage fuer die lebende Ansicht und den HTML-Export.
// collapseAware=true laesst in der Mindmap zugeklappte Aeste (mmZu) wie
// Blaetter zaehlen, damit sie im Bild keinen Platz beanspruchen — der Export
// legt dagegen immer voll aus, sonst liessen sich dort keine Aeste mehr
// AUFklappen, die beim Export gerade zu waren.
function mindmapLayout(collapseAware){
  const sichtbar = new Set(rowIndex.map(r => r.id));
  const kinderEcht = id => (nodes[id] ? nodes[id].children.filter(c => sichtbar.has(c)) : []);
  const kinderLayout = collapseAware ? (id => (mmZu.has(id) ? [] : kinderEcht(id))) : kinderEcht;

  const blaetter = id => {
    const k = kinderLayout(id);
    return k.length ? k.reduce((s, c) => s + blaetter(c), 0) : 1;
  };
  let tiefstes = 0;
  (function tiefeMessen(id, tiefe){
    if (tiefe > tiefstes) tiefstes = tiefe;
    for (const c of kinderLayout(id)) tiefeMessen(c, tiefe + 1);
  })(zoomId, 0);
  tiefstes = Math.max(1, tiefstes);

  const punkte = [];
  const ergebnis = mindmapTyp === "baum" ? legeBaum(zoomId, kinderLayout, blaetter, tiefstes, punkte)
    : mindmapTyp === "zeit" ? legeZeit(zoomId, kinderLayout, blaetter, tiefstes, punkte)
    : legeRadialWurzel(zoomId, kinderLayout, blaetter, tiefstes, punkte);

  return { punkte, breite: ergebnis.breite, hoehe: ergebnis.hoehe,
           sonderPfade: ergebnis.sonderPfade || [], kinderEcht };
}

function mindmapLeiste(){
  const leiste = document.createElement("div");
  leiste.className = "mmkopf";

  const gruppe = document.createElement("div");
  gruppe.className = "mmgruppe";

  const feldTyp = document.createElement("div");
  feldTyp.className = "mmfeld";
  const bTyp = document.createElement("b"); bTyp.textContent = "Typ";
  const typen = document.createElement("div");
  typen.className = "mmtypen";
  for (const t of MINDMAP_TYPEN){
    const btn = document.createElement("button");
    btn.className = "mmtyp" + (t === mindmapTyp ? " an" : "");
    btn.textContent = MINDMAP_TYP_LABEL[t];
    btn.addEventListener("click", () => { mindmapTyp = t; scheduleSave(); render(false); });
    typen.appendChild(btn);
  }
  feldTyp.append(bTyp, typen);

  const feldFarbe = document.createElement("div");
  feldFarbe.className = "mmfeld";
  const bFarbe = document.createElement("b"); bFarbe.textContent = "Farbe";
  const farben = document.createElement("div");
  farben.className = "mmfarben";
  for (const f of MINDMAP_FARBEN){
    const btn = document.createElement("button");
    btn.className = "mmfarbe" + (f === mindmapFarbe ? " an" : "");
    btn.title = f[0].toUpperCase() + f.slice(1);
    btn.style.background = MINDMAP_THEMEN[f].aeste[0].bg;
    const kern = document.createElement("i");
    kern.style.background = MINDMAP_THEMEN[f].wurzel.bg;
    btn.appendChild(kern);
    btn.addEventListener("click", () => { mindmapFarbe = f; scheduleSave(); render(false); });
    farben.appendChild(btn);
  }
  feldFarbe.append(bFarbe, farben);

  gruppe.append(feldTyp, feldFarbe);

  const aktionen = document.createElement("div");
  aktionen.className = "mmaktionen";
  const btnAuf = document.createElement("button");
  btnAuf.className = "knopf";
  btnAuf.textContent = "Alle aufklappen";
  btnAuf.addEventListener("click", () => { mmZu.clear(); render(false); });
  const btnExport = document.createElement("button");
  btnExport.className = "knopf";
  btnExport.textContent = "Als HTML exportieren";
  btnExport.addEventListener("click", exportMindmapHTML);
  aktionen.append(btnAuf, btnExport);

  leiste.append(gruppe, aktionen);
  return leiste;
}

function zeichneMindmap(){
  mindmapEl.textContent = "";
  mindmapEl.className = "mindmap typ-" + mindmapTyp;
  mindmapEl.appendChild(mindmapLeiste());

  const { punkte, breite, hoehe, sonderPfade, kinderEcht } = mindmapLayout(true);
  const thema = MINDMAP_THEMEN[mindmapFarbe];

  const karte = document.createElement("div");
  karte.className = "mkarte";
  karte.style.width = breite + "px";
  karte.style.height = hoehe + "px";

  const wo = new Map(punkte.map(p => [p.id, p]));
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 " + breite + " " + hoehe);
  for (const sp of sonderPfade){
    const linie = document.createElementNS("http://www.w3.org/2000/svg", "line");
    linie.setAttribute("x1", sp.x1); linie.setAttribute("y1", sp.y1);
    linie.setAttribute("x2", sp.x2); linie.setAttribute("y2", sp.y2);
    linie.setAttribute("stroke", sp.farbe); linie.setAttribute("stroke-width", sp.dick || 1.3);
    svg.appendChild(linie);
  }
  for (const p of punkte){
    for (const cid of kinderEcht(p.id)){
      const k = wo.get(cid);
      if (!k) continue;
      const farbe = k.farbindex == null ? "var(--rule2)" : thema.aeste[k.farbindex % thema.aeste.length].linie;
      const pfad = document.createElementNS("http://www.w3.org/2000/svg", "path");
      pfad.setAttribute("d", mindmapTyp === "baum" ? mmKnick(p, k) : mmBogen(p, k));
      pfad.setAttribute("fill", "none");
      pfad.setAttribute("stroke", farbe);
      pfad.setAttribute("stroke-width", "1.3");
      pfad.setAttribute("opacity", "0.85");
      svg.appendChild(pfad);
    }
  }
  karte.appendChild(svg);

  for (const p of punkte){
    const n = nodes[p.id];
    const istWurzel = p.id === zoomId;
    const farbe = istWurzel ? thema.wurzel : thema.aeste[p.farbindex % thema.aeste.length];
    const b = document.createElement("button");
    b.className = mmKlassen(p, n, istWurzel);
    b.style.left = p.x + "px";
    b.style.top = p.y + "px";
    b.style.background = farbe.bg;
    b.style.color = farbe.fg;
    // Abgeschnittene Rohmarken helfen niemandem; den Zustand tragen hier
    // Durchstreichung und Rahmenfarbe.
    const kurz = n.text.replace(FRIST_RE, "").replace(PROZENT_RE, "")
                       .replace(PRIO_RE, "").replace(/\s{2,}/g, " ").trim();
    const hatKinder = kinderEcht(p.id).length > 0;
    b.innerHTML = (hatKinder ? '<span class="mfalt">' + (mmZu.has(p.id) ? "+" : "–") + '</span>' : "")
      + schmuecke(kurz || n.text.trim() || "Ohne Text", false);
    b.title = n.text.trim() || "Ohne Text";
    b.addEventListener("click", e => {
      if (hatKinder && e.target.closest(".mfalt")){
        e.stopPropagation();
        if (mmZu.has(p.id)) mmZu.delete(p.id); else mmZu.add(p.id);
        render(false);
        return;
      }
      setzeAnsicht("gliederung"); zoomTo(p.id);
    });
    karte.appendChild(b);
  }

  const flaeche = document.createElement("div");
  flaeche.className = "mmflaeche";
  flaeche.appendChild(karte);
  mindmapEl.appendChild(flaeche);
  // auf die Mitte einrollen, sonst begaenne die Karte in der Ecke
  flaeche.scrollLeft = (breite - flaeche.clientWidth) / 2;
  flaeche.scrollTop = (hoehe - flaeche.clientHeight) / 2;
}

// Eigenstaendige HTML-Datei aus dem aktuellen Stand der Mindmap — reine
// Ansicht ohne Bearbeitung, aber mit demselben Auf- und Zuklappen. Layout
// immer voll ausgelegt (mindmapLayout(false)), sonst liesse sich dort nichts
// mehr aufklappen, was beim Export gerade zu war.
function exportMindmapHTML(){
  const { punkte, breite, hoehe, sonderPfade, kinderEcht } = mindmapLayout(false);
  const thema = MINDMAP_THEMEN[mindmapFarbe];
  const wo = new Map(punkte.map(p => [p.id, p]));
  const kinderMap = {};

  let pfade = "";
  for (const sp of sonderPfade){
    pfade += '<line x1="' + sp.x1 + '" y1="' + sp.y1 + '" x2="' + sp.x2 + '" y2="' + sp.y2 +
      '" stroke="' + sp.farbe.replace("var(--rule2)", "#cbc6ba") + '" stroke-width="' + (sp.dick || 1.3) + '"/>';
  }
  for (const p of punkte){
    kinderMap[p.id] = kinderEcht(p.id).filter(cid => wo.has(cid));
    for (const cid of kinderMap[p.id]){
      const k = wo.get(cid);
      const farbe = k.farbindex == null ? "#cbc6ba" : thema.aeste[k.farbindex % thema.aeste.length].linie;
      const d = mindmapTyp === "baum" ? mmKnick(p, k) : mmBogen(p, k);
      pfade += '<path data-kante="' + p.id + '|' + cid + '" d="' + d +
        '" fill="none" stroke="' + farbe + '" stroke-width="1.3" opacity="0.85"/>';
    }
  }

  let knoten = "";
  for (const p of punkte){
    const n = nodes[p.id];
    const istWurzel = p.id === zoomId;
    const farbe = istWurzel ? thema.wurzel : thema.aeste[p.farbindex % thema.aeste.length];
    const kurz = n.text.replace(FRIST_RE, "").replace(PROZENT_RE, "")
                       .replace(PRIO_RE, "").replace(/\s{2,}/g, " ").trim();
    const klassen = mmKlassen(p, n, istWurzel);
    const hatKinder = kinderMap[p.id].length > 0;
    const falt = hatKinder ? '<span class="mfalt">' + (mmZu.has(p.id) ? "+" : "–") + '</span>' : "";
    knoten += '<div class="' + klassen + '" data-id="' + escHtml(p.id) + '" style="left:' + p.x +
      'px;top:' + p.y + 'px;background:' + farbe.bg + ';color:' + farbe.fg + '">' +
      falt + escHtml(kurz || n.text.trim() || "Ohne Text") + '</div>';
  }

  const titel = nodes[zoomId].text.trim() || "Mindmap";
  const zuStart = JSON.stringify([...mmZu].filter(id => wo.has(id)));
  const html = "<!doctype html>\n<html lang=\"de\"><head><meta charset=\"utf-8\">\n" +
    "<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n" +
    "<title>" + escHtml(titel) + " — Mindmap</title>\n<style>\n" + MINDMAP_EXPORT_CSS + "\n</style></head>\n<body>\n" +
    "<header><h1>" + escHtml(titel) + "</h1><p>Exportiert aus dem Outliner, " + stamp().replace("_", " ") +
    " — reine Ansicht ohne Bearbeitung. Äste lassen sich weiterhin auf- und zuklappen.</p></header>\n" +
    "<div class=\"mmbuehne\"><div class=\"mkarte\" style=\"width:" + breite + "px;height:" + hoehe + "px\">\n" +
    "<svg viewBox=\"0 0 " + breite + " " + hoehe + "\">" + pfade + "</svg>\n" + knoten + "\n</div></div>\n" +
    "<" + "script>\n" +
    "const KINDER = " + JSON.stringify(kinderMap) + ";\n" +
    "let zu = new Set(" + zuStart + ");\n" +
    "function sichtbarkeit(){\n" +
    "  const versteckt = new Set();\n" +
    "  (function markiere(id, v){\n" +
    "    if (v) versteckt.add(id);\n" +
    "    (KINDER[id] || []).forEach(c => markiere(c, v || zu.has(id)));\n" +
    "  })(" + JSON.stringify(zoomId) + ", false);\n" +
    "  document.querySelectorAll('.mast').forEach(el => { el.hidden = versteckt.has(el.dataset.id); });\n" +
    "  document.querySelectorAll('path[data-kante]').forEach(el => {\n" +
    "    const ziel = el.dataset.kante.split('|')[1];\n" +
    "    el.style.display = versteckt.has(ziel) ? 'none' : '';\n" +
    "  });\n" +
    "  document.querySelectorAll('.mfalt').forEach(el => {\n" +
    "    const id = el.closest('.mast').dataset.id;\n" +
    "    el.textContent = zu.has(id) ? '+' : '–';\n" +
    "  });\n" +
    "}\n" +
    "document.querySelectorAll('.mfalt').forEach(el => {\n" +
    "  el.addEventListener('click', e => {\n" +
    "    e.stopPropagation();\n" +
    "    const id = el.closest('.mast').dataset.id;\n" +
    "    if (zu.has(id)) zu.delete(id); else zu.add(id);\n" +
    "    sichtbarkeit();\n" +
    "  });\n" +
    "});\n" +
    "sichtbarkeit();\n" +
    "<" + "/script>\n</body></html>";

  download(safeName(zoomId) + "-mindmap_" + stamp() + ".html", html, "text/html");
  toast("Mindmap als HTML exportiert");
}

const MINDMAP_EXPORT_CSS =
  "*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}" +
  "body{background:#f7f5f0;color:#1a1a18;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:26px}" +
  "header{max-width:860px;margin:0 auto 18px}" +
  "header h1{font-family:Georgia,'Iowan Old Style',serif;font-weight:400;font-size:22px;margin-bottom:6px}" +
  "header p{font-size:13px;color:#54514b;line-height:1.5}" +
  ".mmbuehne{overflow:auto;max-height:80vh;border:1px solid #e2ded4;border-radius:10px;background:#fffefb}" +
  ".mkarte{position:relative}" +
  ".mkarte svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}" +
  ".mast{position:absolute;transform:translate(-50%,-50%);max-width:150px;font-size:12.5px;line-height:1.3;" +
  "border:1px solid transparent;border-radius:20px;padding:5px 12px;white-space:nowrap;overflow:hidden;" +
  "text-overflow:ellipsis;cursor:pointer}" +
  ".mast.rechts{transform:translate(3px,-50%)}.mast.links{transform:translate(calc(-100% - 3px),-50%)}" +
  ".mast.flach{transform:translate(-50%,-50%)}.mast.eckig{border-radius:6px}" +
  ".mast.mitte{font-family:Georgia,'Iowan Old Style',serif;font-size:16px;max-width:220px;padding:7px 15px;" +
  "transform:translate(-50%,-50%);border-color:#cbc6ba}" +
  ".mast.erledigt{opacity:.55;text-decoration:line-through}" +
  ".mast.ueberfaellig{border-color:#a8321f;border-width:2px}" +
  ".mfalt{font-family:ui-monospace,monospace;font-size:10px;opacity:.75;margin-right:5px}";

/* =========================================================================
   14 — Start
   ========================================================================= */

if (!load()) { seed(); save(); }
render(false);
const firstRow = rowIndex[0];
if (firstRow) focusNode(firstRow.id, "text", Infinity);
